name: Chart checks

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chart-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: helm/chart-testing-action@v2.8.0
      - name: Lint chart and all CI values
        run: ct lint --config ct.yaml

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        values: [deployment, statefulset, daemonset, cronjob, resources, autoscaler]
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.0
      - uses: helm/kind-action@v1.12.0
      - name: Validate manifests with the Kubernetes API
        run: helm template smoke . -f ci/${{ matrix.values }}-values.yaml | kubectl apply --dry-run=server -f -
