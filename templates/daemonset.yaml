{{- if .Values.daemonset.enabled }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $.Release.Name }}
  labels:
    app.kubernetes.io/component: anychart
    app.kubernetes.io/instance: {{ $.Release.Name }}
    {{- with .Values.daemonset.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: anychart
      app.kubernetes.io/instance: {{ $.Release.Name }}
  {{- with .Values.daemonset.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  minReadySeconds: {{ .Values.daemonset.minReadySeconds }}
  revisionHistoryLimit: {{ .Values.daemonset.revisionHistoryLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: anychart
        app.kubernetes.io/instance: {{ $.Release.Name }}
        {{- if .Values.daemonset.labels }}
        {{toYaml .Values.daemonset.labels | nindent 8 }}
        {{- end }}
      {{- with .Values.daemonset.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.daemonset.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.daemonset.runtimeClassName }}
      runtimeClassName: {{ .Values.daemonset.runtimeClassName }}
      {{- end }}
      {{- if .Values.daemonset.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml .Values.daemonset.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if .Values.daemonset.nodeSelector }}
      nodeSelector:
      {{- toYaml .Values.daemonset.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.daemonset.hostIPC }}
      hostIPC: {{.Values.daemonset.hostIPC }}
      {{- end }}
      {{- if .Values.daemonset.affinity }}
      affinity:
      {{toYaml .Values.daemonset.affinity | nindent 8 }}
      {{- end }}
      {{- if or .Values.priorityClass.name .Values.priorityClass.enabled }}
      priorityClassName: {{default $.Release.Name .Values.priorityClass.name }}
      {{- end }}
      {{- if or .Values.serviceAccount.name .Values.serviceAccount.enabled }}
      serviceAccountName: {{default $.Release.Name .Values.serviceAccount.name }}
      {{- end }}
      {{- if .Values.daemonset.initContainers }}
      initContainers:
      {{ toYaml .Values.daemonset.initContainers | nindent 8 }}
      {{- end }}
      {{- if .Values.daemonset.podSecurityContext }}
      securityContext:
      {{- toYaml .Values.daemonset.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - image: {{ required "daemonset.image is required when enabled" .Values.daemonset.image | quote }}
          name: {{ $.Release.Name }}
          imagePullPolicy: {{ default "IfNotPresent" .Values.daemonset.imagePullPolicy }}
          {{- if .Values.daemonset.securityContext }}
          securityContext:
          {{- toYaml .Values.daemonset.securityContext | nindent 12 }}
          {{- end }}
          {{- with .Values.daemonset.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.daemonset.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.daemonset.command }}
          command:
          {{- toYaml .Values.daemonset.command | nindent 12 }}
          {{- end }}
          {{- if .Values.daemonset.args }}
          args:
          {{- toYaml .Values.daemonset.args | nindent 12 }}
          {{- end }}
          {{- if .Values.daemonset.livenessProbe }}
          livenessProbe:
          {{toYaml .Values.daemonset.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.daemonset.readinessProbe }}
          readinessProbe:
          {{toYaml .Values.daemonset.readinessProbe | nindent 12 }}
          {{- end }}
          {{- with .Values.daemonset.env }}
          env:
          {{ toYaml $.Values.daemonset.env | nindent 12 }}
          {{- end }}
          {{- with .Values.daemonset.ports }}
          ports:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.daemonset.resources }}
          resources:
          {{toYaml .Values.daemonset.resources | nindent 12 }}
          {{- end }}
          {{- if .Values.daemonset.volumeMounts }}
          volumeMounts:
          {{toYaml .Values.daemonset.volumeMounts | nindent 12 }}
          {{- end }}
      {{- if .Values.daemonset.volumes }}
      volumes:
      {{toYaml .Values.daemonset.volumes | nindent 8 }}
      {{- end }}
      restartPolicy: Always
{{- end }}
