{{- if .Values.clusterRoleBinding.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ default (printf "%s-%s" .Release.Namespace .Release.Name) .Values.clusterRoleBinding.name }}
  labels:
    app.kubernetes.io/component: anychart
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- with .Values.clusterRoleBinding.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.clusterRoleBinding.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ default (default (printf "%s-%s" .Release.Namespace .Release.Name) .Values.clusterRole.name) .Values.clusterRoleBinding.roleRef.name }}
subjects:
  {{- if .Values.clusterRoleBinding.subjects }}
  {{- toYaml .Values.clusterRoleBinding.subjects | nindent 2 }}
  {{- else }}
  {{- if not (or .Values.serviceAccount.enabled .Values.serviceAccount.name) }}
  {{- fail "clusterRoleBinding requires explicit subjects or an enabled/named serviceAccount" }}
  {{- end }}
  - kind: ServiceAccount
    name: {{ default .Release.Name .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
  {{- end }}
{{- end }}
