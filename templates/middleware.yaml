{{- if .Values.middleware.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ default .Release.Name .Values.middleware.name }}
  labels:
    app.kubernetes.io/component: anychart
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- with .Values.middleware.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.middleware.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml .Values.middleware.spec | nindent 2 }}
{{- end }}
