{{- if .Values.ingressroute.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $.Release.Name }}
  labels:
    app.kubernetes.io/component: anychart
    app.kubernetes.io/instance: {{ $.Release.Name }}
    {{- if $.Values.ingressroute.labels }}
    {{- toYaml $.Values.ingressroute.labels | nindent 4 }}
    {{- end }}
  {{- if $.Values.ingressroute.annotations }}
  annotations:
    {{- toYaml $.Values.ingressroute.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if $.Values.ingressroute.entryPoints }}
  entryPoints:
    {{- toYaml $.Values.ingressroute.entryPoints | nindent 4 }}
  {{- end }}
  routes:
    {{- toYaml $.Values.ingressroute.routes | nindent 4 }}
  {{- if $.Values.ingressroute.tls }}
  tls:
    {{- toYaml $.Values.ingressroute.tls | nindent 4 }}
  {{- end }}
{{- end }}
