{{- if .Values.ingressrouteTCP.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ default .Release.Name .Values.ingressrouteTCP.name }}
  labels:
    app.kubernetes.io/component: anychart
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- with .Values.ingressrouteTCP.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.ingressrouteTCP.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingressrouteTCP.entryPoints }}
  entryPoints:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  routes:
    {{- toYaml .Values.ingressrouteTCP.routes | nindent 4 }}
  {{- with .Values.ingressrouteTCP.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
