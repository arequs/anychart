{{- if .Values.clusterRole.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ default (printf "%s-%s" .Release.Namespace .Release.Name) .Values.clusterRole.name }}
  labels:
    app.kubernetes.io/component: anychart
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- with .Values.clusterRole.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.clusterRole.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  {{- toYaml .Values.clusterRole.rules | nindent 2 }}
{{- end }}
