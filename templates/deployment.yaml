{{- if .Values.deployment.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}
  labels:
    app.kubernetes.io/component: anychart
    app.kubernetes.io/instance: {{ $.Release.Name }}
    {{- with .Values.deployment.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: anychart
      app.kubernetes.io/instance: {{ $.Release.Name }}
{{- if not (and .Values.autoscaler.enabled (eq .Values.autoscaler.targetKind "Deployment")) }}
  replicas: {{ .Values.deployment.replicas }}
{{- end }}
  {{- if .Values.deployment.strategy }}
  strategy:
  {{toYaml .Values.deployment.strategy | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: anychart
        app.kubernetes.io/instance: {{ $.Release.Name }}
        {{- if .Values.deployment.labels }}
        {{toYaml .Values.deployment.labels | nindent 8 }}
        {{- end }}
      {{- with .Values.deployment.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.deployment.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.deployment.runtimeClassName }}
      runtimeClassName: {{ .Values.deployment.runtimeClassName }}
      {{- end }}
      {{- if .Values.deployment.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml .Values.deployment.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if .Values.deployment.nodeSelector }}
      nodeSelector:
      {{- toYaml .Values.deployment.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.deployment.hostIPC }}
      hostIPC: {{.Values.deployment.hostIPC }}
      {{- end }}
      {{- if .Values.deployment.affinity }}
      affinity:
      {{toYaml .Values.deployment.affinity | nindent 8 }}
      {{- end }}
      {{- if or .Values.priorityClass.name .Values.priorityClass.enabled }}
      priorityClassName: {{default $.Release.Name .Values.priorityClass.name }}
      {{- end }}
      {{- if or .Values.serviceAccount.name .Values.serviceAccount.enabled }}
      serviceAccountName: {{default $.Release.Name .Values.serviceAccount.name }}
      {{- end }}
      {{- if .Values.deployment.initContainers }}
      initContainers:
      {{ toYaml .Values.deployment.initContainers | nindent 8 }}
      {{- end }}
      {{- if .Values.deployment.podSecurityContext }}
      securityContext:
      {{- toYaml .Values.deployment.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - image: {{ required "deployment.image is required when enabled" .Values.deployment.image | quote }}
          name: {{ $.Release.Name }}
          imagePullPolicy: {{ default "IfNotPresent" .Values.deployment.imagePullPolicy }}
          {{- if .Values.deployment.securityContext }}
          securityContext:
          {{- toYaml .Values.deployment.securityContext | nindent 12 }}
          {{- end }}
          {{- with .Values.deployment.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.deployment.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.deployment.command }}
          command:
          {{- toYaml .Values.deployment.command | nindent 12 }}
          {{- end }}
          {{- if .Values.deployment.args }}
          args:
          {{- toYaml .Values.deployment.args | nindent 12 }}
          {{- end }}
          {{- if .Values.deployment.livenessProbe }}
          livenessProbe:
          {{toYaml .Values.deployment.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.deployment.readinessProbe }}
          readinessProbe:
          {{toYaml .Values.deployment.readinessProbe | nindent 12 }}
          {{- end }}
          {{- with .Values.deployment.env }}
          env:
          {{ toYaml $.Values.deployment.env | nindent 12 }}
          {{- end }}
          {{- with .Values.deployment.ports }}
          ports:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.deployment.resources }}
          resources:
          {{toYaml .Values.deployment.resources | nindent 12 }}
          {{- end }}
          {{- if .Values.deployment.volumeMounts }}
          volumeMounts:
          {{toYaml .Values.deployment.volumeMounts | nindent 12 }}
          {{- end }}
      {{- if .Values.deployment.volumes }}
      volumes:
      {{toYaml .Values.deployment.volumes | nindent 8 }}
      {{- end }}
      restartPolicy: Always
{{- end }}
